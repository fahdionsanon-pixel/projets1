<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commun('Incidents')}"></head>
<body>
    <div th:replace="~{fragments/nav :: navigation}"></div>
    <div class="topbar">
        <h1>Incidents</h1>
        <a class="btn" th:href="@{/incidents/creation-formulaire}">Nouvel incident</a>
        <form th:action="@{/logout}" method="post" style="display:inline;">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div th:replace="~{fragments/nav :: deconnexion}"></div>
        </form>
    </div>

    <main>
        <div class="incident-list" th:if="${not #lists.isEmpty(incidents)}">
            <div class="incident-row" th:each="incident : ${incidents}"
                 th:classappend="'priorite-' + ${incident.priorite}">
                <span class="incident-id" th:text="'#' + ${incident.id}"></span>
                <span class="incident-titre">
                    <span th:text="${incident.titre}"></span>
                    <span class="desc" th:text="${incident.description}"></span>
                </span>
                <span class="badge-priorite" th:text="${incident.priorite}"></span>
                <span class="statut">
                    <span class="dot"
                          th:classappend="${incident.statut.name() == 'NOUVEAU' or incident.statut.name() == 'EN_COURS'} ? 'actif' : ''"></span>
                    <form th:action="@{/incidents/{id}/statut(id=${incident.id})}" method="post" style="display:inline;">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <select name="statut" onchange="this.form.submit()"
                                style="width:auto; margin:0; padding:4px 8px; font-size:12px;">
                            <option value="NOUVEAU" th:selected="${incident.statut.name() == 'NOUVEAU'}">NOUVEAU</option>
                            <option value="EN_COURS" th:selected="${incident.statut.name() == 'EN_COURS'}">EN_COURS</option>
                            <option value="RESOLU" th:selected="${incident.statut.name() == 'RESOLU'}">RESOLU</option>
                            <option value="FERME" th:selected="${incident.statut.name() == 'FERME'}">FERME</option>
                        </select>
                    </form>
                </span>
            </div>
        </div>

        <div class="empty-state" th:if="${#lists.isEmpty(incidents)}">
            Aucun incident pour l'instant. Tout va bien.
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Problèmes</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="nav-links">
        <a th:href="@{/incidents}">Incidents</a>
        <a th:href="@{/problemes}">Problèmes</a>
        <a th:href="@{/solutions}">Solutions</a>
        <a th:href="@{/actifit/list}">Actifs IT</a>
    </div>
    <div class="topbar">
        <h1>Problèmes</h1>
        <a class="btn" th:href="@{/problemes/nouveau}">Nouveau problème</a>
    </div>
    <main>
        <div class="incident-list" th:if="${not #lists.isEmpty(problemes)}">
            <div class="incident-row" th:each="p : ${problemes}">
                <span class="incident-id" th:text="'#' + ${p.id}"></span>
                <span class="incident-titre">
                    <span th:text="${p.description}"></span>
                    <span class="desc" th:text="${p.cause}"></span>
                </span>
                <span class="badge-priorite" th:text="${p.statut}"></span>
            </div>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(problemes)}">
            Aucun problème enregistré pour l'instant.
        </div>
    </main>
</body>
</html>

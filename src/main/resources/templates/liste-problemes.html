<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commun('Problèmes')}"></head>
<body>
    <div th:replace="~{fragments/nav :: navigation}"></div>
    <div class="topbar">
        <h1>Problèmes</h1>
        <a class="btn" th:href="@{/problemes/nouveau}">Nouveau problème</a>
        <div th:replace="~{fragments/nav :: deconnexion}"></div>
    </div>
    <main>
        <div class="incident-list" th:if="${not #lists.isEmpty(problemes)}">
            <div class="incident-row" th:each="p : ${problemes}"
                 th:classappend="'statut-' + ${p.statut}">
                <span class="incident-id" th:text="'#' + ${p.id}"></span>
                <span class="incident-titre">
                    <span th:text="${p.description}"></span>
                    <span class="desc" th:text="${p.cause}"></span>
                </span>
                <form th:action="@{/problemes/{id}/statut(id=${p.id})}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <select name="statut" onchange="this.form.submit()"
                            style="width:auto; margin:0; padding:4px 8px; font-size:12px;">
                        <option value="OUVERT" th:selected="${p.statut.name() == 'OUVERT'}">OUVERT</option>
                        <option value="EN_COURS" th:selected="${p.statut.name() == 'EN_COURS'}">EN_COURS</option>
                        <option value="RESOLU" th:selected="${p.statut.name() == 'RESOLU'}">RESOLU</option>
                        <option value="FERME" th:selected="${p.statut.name() == 'FERME'}">FERME</option>
                    </select>
                </form>
                <span class="statut">
                    <span class="dot"
                          th:classappend="${p.statut.name() == 'OUVERT' or p.statut.name() == 'EN_COURS'} ? 'actif' : ''"></span>
                </span>
            </div>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(problemes)}">
            Aucun problème enregistré pour l'instant.
        </div>
    </main>
</body>
</html>

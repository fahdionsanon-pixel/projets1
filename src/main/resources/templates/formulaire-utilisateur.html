<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Créer un compte</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main>
        <div class="form-card" style="margin-top: 60px;">
            <h1>Créer un compte</h1>
            <form th:action="@{/utilisateurs/nouveau}" th:object="${utilisateur}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label for="nom">Nom</label>
                <input type="text" id="nom" th:field="*{nom}" placeholder="Marc Dupont" />

                <label for="email">Email</label>
                <input type="text" id="email" th:field="*{email}" placeholder="marc@exemple.com" />

                <label for="motDePasse">Mot de passe</label>
                <input type="password" id="motDePasse" th:field="*{motDePasse}" placeholder="••••••••" />

                <label for="role">Rôle</label>
                <select id="role" th:field="*{role}">
                    <option value="UTILISATEUR">Utilisateur</option>
                    <option value="TECHNICIEN">Technicien</option>
                    <option value="ADMIN">Admin</option>
                </select>

                <button type="submit" class="btn">Créer mon compte</button>
            </form>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Créer un compte</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <main>
        <div class="form-card" style="margin-top: 60px;">
            <h1>Créer un compte</h1>
            <form th:action="@{/utilisateurs/nouveau}" th:object="${utilisateur}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label for="nom">Nom</label>
                <input type="text" id="nom" th:field="*{nom}" placeholder="Marc Dupont" />
                <span th:if="${#fields.hasErrors('nom')}" th:errors="*{nom}" style="color: var(--critique); font-size: 13px;"></span>

                <label for="email">Email</label>
                <input type="text" id="email" th:field="*{email}" placeholder="marc@exemple.com" />
                <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" style="color: var(--critique); font-size: 13px;"></span>

                <label for="motDePasse">Mot de passe</label>
                <input type="password" id="motDePasse" th:field="*{motDePasse}" placeholder="••••••••" />
                <span th:if="${#fields.hasErrors('motDePasse')}" th:errors="*{motDePasse}" style="color: var(--critique); font-size: 13px;"></span>
                
                <button type="submit" class="btn">Créer mon compte</button>
            </form>
        </div>
    </main>
</body>
</html>

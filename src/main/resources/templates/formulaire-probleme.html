<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouveau problème</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="nav-links">
        <a th:href="@{/incidents}">Incidents</a>
        <a th:href="@{/problemes}">Problèmes</a>
        <a th:href="@{/solutions}">Solutions</a>
        <a th:href="@{/actifit/list}">Actifs IT</a>
    </div>
    <div class="topbar">
        <h1>Problèmes</h1>
        <a class="btn" th:href="@{/problemes}">Voir la liste</a>
    </div>
    <main>
        <div class="form-card">
            <h1>Déclarer un problème</h1>
            <form th:action="@{/problemes/nouveau}" th:object="${probleme}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" placeholder="Cause racine identifiée sur plusieurs incidents"></textarea>

                <label for="cause">Cause</label>
                <input type="text" id="cause" th:field="*{cause}" placeholder="Ex : fuite mémoire" />

                <button type="submit" class="btn">Créer le problème</button>
            </form>
        </div>
    </main>
</body>
</html>

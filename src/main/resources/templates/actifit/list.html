<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: commun('Incidents')}"></head>
<body>
    <div class="nav-links">
        <a th:href="@{/incidents}">Incidents</a>
        <a th:href="@{/problemes}">Problèmes</a>
        <a th:href="@{/solutions}">Solutions</a>
        <a th:href="@{/actifit/list}">Actifs IT</a>
    </div>
    <div class="topbar">
        <h1>Actifs IT</h1>
        <a class="btn" th:href="@{/actifit/nouveau}">Nouveau actif</a>
        <div th:replace="~{fragments/nav :: deconnexion}"></div>
    </div>
    <main>
        <div class="incident-list" th:if="${not #lists.isEmpty(actifits)}">
            <div class="incident-row" th:each="a : ${actifits}">
                <span class="incident-id" th:text="'#' + ${a.id}"></span>
                <span class="incident-titre">
                    <span th:text="${a.nom}"></span>
                    <span class="desc" th:text="'v' + ${a.version}"></span>
                </span>
                <span class="badge-type" th:text="${a.type}"></span>
            </div>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(actifits)}">
            Aucun actif IT enregistré pour l'instant.
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouvel actif IT</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="topbar">
        <h1>Actifs IT</h1>
        <a class="btn" th:href="@{/actifit/list}">Voir la liste</a>
    </div>
    <main>
        <div class="form-card">
            <h1>Ajouter un actif IT</h1>
            <form th:action="@{/actifit/create}" th:object="${actifIT}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label for="nom">Nom</label>
                <input type="text" id="nom" th:field="*{nom}" placeholder="Ex : Serveur Web 01" />

                <label for="type">Type</label>
                <input type="text" id="type" th:field="*{type}" placeholder="Ex : Serveur, Routeur, Pare-feu" />

                <label for="version">Version</label>
                <input type="text" id="version" th:field="*{version}" placeholder="Ex : Ubuntu 22.04" />

                <button type="submit" class="btn">Créer l'actif</button>
            </form>
        </div>
    </main>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nouvelle solution</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="topbar">
        <h1>Solutions</h1>
        <a class="btn" th:href="@{/solutions}">Voir la liste</a>
    </div>
    <main>
        <div class="form-card">
            <h1>Proposer une solution</h1>
            <form th:action="@{/solutions/nouveau}" th:object="${solution}" method="post">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

                <label for="description">Description</label>
                <textarea id="description" th:field="*{description}" placeholder="Décris la solution proposée"></textarea>

                <label for="type">Type</label>
                <input type="text" id="type" th:field="*{type}" placeholder="Ex : Correctif temporaire" />

                <button type="submit" class="btn">Créer la solution</button>
            </form>
        </div>
    </main>
</body>
</html>

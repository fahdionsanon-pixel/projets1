<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Solutions</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="nav-links">
        <a th:href="@{/incidents}">Incidents</a>
        <a th:href="@{/problemes}">Problèmes</a>
        <a th:href="@{/solutions}">Solutions</a>
        <a th:href="@{/actifit/list}">Actifs IT</a>
    </div>
    <div class="topbar">
        <h1>Solutions</h1>
        <a class="btn" th:href="@{/solutions/nouveau}">Nouvelle solution</a>
    </div>
    <main>
        <div class="incident-list" th:if="${not #lists.isEmpty(solutions)}">
            <div class="incident-row" th:each="s : ${solutions}"
                 th:classappend="'statut-' + ${s.statut}">
                <span class="incident-id" th:text="'#' + ${s.id}"></span>
                <span class="incident-titre">
                    <span th:text="${s.description}"></span>
                    <span class="desc" th:text="${s.type}"></span>
                </span>
                <form th:action="@{/solutions/{id}/statut(id=${s.id})}" method="post" style="display:inline;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <select name="statut" onchange="this.form.submit()"
                            style="width:auto; margin:0; padding:4px 8px; font-size:12px;">
                        <option value="PROPOSEE" th:selected="${s.statut.name() == 'PROPOSEE'}">PROPOSEE</option>
                        <option value="APPROUVEE" th:selected="${s.statut.name() == 'APPROUVEE'}">APPROUVEE</option>
                        <option value="REJETEE" th:selected="${s.statut.name() == 'REJETEE'}">REJETEE</option>
                    </select>
                </form>
                <span class="statut">
                    <span class="dot"
                          th:classappend="${s.statut.name() == 'PROPOSEE'} ? 'actif' : ''"></span>
                </span>
            </div>
        </div>
        <div class="empty-state" th:if="${#lists.isEmpty(solutions)}">
            Aucune solution enregistrée pour l'instant.
        </div>
    </main>
</body>
</html>
